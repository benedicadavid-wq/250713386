<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>
<body>

    <h1>Formulir Pendaftaran Seminar</h1>

    <!-- Formulir Pendaftaran -->
    <form action="" method="post" enctype="multipart/form-data">

        <!-- Tabel 1: Data Peserta -->
        <h2>Data Peserta</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <td style="width:32%;">
                    <label for="namaLengkap"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="namaLengkap" name="namaLengkap" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="nim"><strong>NIM</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jenisKelamin" value="Laki-laki" />
                    <label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jenisKelamin" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="programStudi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="programStudi" name="programStudi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 2: Pilihan Seminar -->
        <h2>Pilihan Seminar</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="jenisTiket" value="Reguler" />
                    <label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="jenisTiket" value="VIP" />
                    <label for="vip">VIP</label>
                </td>
            </tr>
            <tr>
                <!-- Menghapus vertical-align: top agar posisi teks rata tengah vertikal -->
                <td style="width:32%;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="topik1" name="topikSeminar" value="Web Development" />
                        <label for="topik1">Web Development</label><br />
                        <input type="checkbox" id="topik2" name="topikSeminar" value="Data Science" />
                        <label for="topik2">Data Science</label><br />
                        <input type="checkbox" id="topik3" name="topikSeminar" value="Artificial Intelligence" />
                        <label for="topik3">Artificial Intelligence</label>
                    </p>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 3: Informasi Tambahan -->
        <h2>Informasi Tambahan</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <td style="width:32%;">
                    <label for="alasan"><strong>Alasan Mengikuti Seminar</strong></label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="6" cols="35"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="buktiPembayaran"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="buktiPembayaran" name="buktiPembayaran" accept="image/*, application/pdf" />
                </td>
            </tr>
            <tr>
                <!-- Tombol Simpan -->
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan" value="Simpan" />
                </td>
            </tr>
        </table>

    </form>

</body>
</html>
